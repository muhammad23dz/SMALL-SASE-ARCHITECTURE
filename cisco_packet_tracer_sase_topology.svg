<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Consolas', 'Courier New', monospace;">
  <defs>
    <!-- Grid Pattern like Packet Tracer -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <!-- Radial Glow Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Diagram Title Header Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="20" y="32" fill="#38BDF8" font-size="18" font-weight="bold">CISCO PACKET TRACER STYLE — SASE LAB ENTERPRISE NETWORK TOPOLOGY</text>
  <text x="950" y="32" fill="#22C55E" font-size="13" font-weight="bold">● STATUS: VERIFIED OPERATIONAL</text>

  <!-- ================= SUBNET ZONES (PACKET TRACER CLUSTERS) ================= -->

  <!-- HQ Subnet Box -->
  <rect x="50" y="420" width="480" height="330" rx="10" fill="#1E293B" fill-opacity="0.4" stroke="#38BDF8" stroke-dasharray="6,6" stroke-width="2"/>
  <text x="70" y="445" fill="#38BDF8" font-size="14" font-weight="bold">HQ Enterprise Site — Subnet 10.1.0.0/24 (AS 65001)</text>

  <!-- Branch Subnet Box -->
  <rect x="670" y="420" width="480" height="330" rx="10" fill="#1E293B" fill-opacity="0.4" stroke="#A855F7" stroke-dasharray="6,6" stroke-width="2"/>
  <text x="690" y="445" fill="#A855F7" font-size="14" font-weight="bold">Branch Office Site — Subnet 10.2.0.0/24 (AS 65002)</text>

  <!-- Cloud / WAN Zone Box -->
  <rect x="300" y="80" width="600" height="260" rx="15" fill="#0F172A" fill-opacity="0.6" stroke="#64748B" stroke-width="2"/>
  <text x="320" y="105" fill="#94A3B8" font-size="14" font-weight="bold">Public WAN & Cloudflare Zero Trust Fabric (AS 65000)</text>

  <!-- ================= LINKS & WIRES ================= -->

  <!-- BGP eBGP Links (Internet to Routers) -->
  <line x1="600" y1="180" x2="250" y2="340" stroke="#0EA5E9" stroke-width="3"/>
  <text x="400" y="240" fill="#38BDF8" font-size="11" font-weight="bold">eBGP (AS65000 ↔ AS65001)</text>

  <line x1="600" y1="180" x2="950" y2="340" stroke="#0EA5E9" stroke-width="3"/>
  <text x="750" y="240" fill="#38BDF8" font-size="11" font-weight="bold">eBGP (AS65000 ↔ AS65002)</text>

  <!-- WireGuard Tunnel (HQ to Branch) -->
  <line x1="250" y1="340" x2="950" y2="340" stroke="#EAB308" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="530" y="330" fill="#EAB308" font-size="12" font-weight="bold">WireGuard Overlay Mesh (ChaCha20 Encrypted)</text>

  <!-- Internal Links HQ -->
  <line x1="250" y1="340" x2="250" y2="500" stroke="#22C55E" stroke-width="3"/>
  <text x="260" y="420" fill="#94A3B8" font-size="10">eth2 (10.1.0.1)</text>

  <line x1="250" y1="500" x2="130" y2="620" stroke="#22C55E" stroke-width="2"/>
  <line x1="250" y1="500" x2="250" y2="620" stroke="#22C55E" stroke-width="2"/>
  <line x1="250" y1="500" x2="370" y2="620" stroke="#22C55E" stroke-width="2"/>
  <line x1="250" y1="500" x2="460" y2="620" stroke="#22C55E" stroke-width="2"/>

  <!-- Internal Links Branch -->
  <line x1="950" y1="340" x2="950" y2="500" stroke="#22C55E" stroke-width="3"/>
  <text x="960" y="420" fill="#94A3B8" font-size="10">eth2 (10.2.0.1)</text>

  <line x1="950" y1="500" x2="850" y2="620" stroke="#22C55E" stroke-width="2"/>
  <line x1="950" y1="500" x2="1050" y2="620" stroke="#22C55E" stroke-width="2"/>

  <!-- ================= PACKET TRACER DEVICE ICONS ================= -->

  <!-- 1. Internet Cloud / Backbone Router -->
  <g transform="translate(600, 180)">
    <circle r="35" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#glow-blue)"/>
    <!-- Router Cross Arrows -->
    <path d="M -15 0 L 15 0 M 0 -15 L 0 15 M -10 -10 L 10 10 M -10 10 L 10 -10" stroke="#FFFFFF" stroke-width="3"/>
    <text x="0" y="55" fill="#F8FAFC" font-size="13" font-weight="bold" text-anchor="middle">Internet Transit Backbone</text>
    <text x="0" y="70" fill="#94A3B8" font-size="11" text-anchor="middle">IP: 198.51.100.1 | AS 65000</text>
  </g>

  <!-- 2. HQ Edge Router (clab-sase-lab-hq-rtr) -->
  <g transform="translate(250, 340)">
    <circle r="32" fill="#0369A1" stroke="#38BDF8" stroke-width="3"/>
    <path d="M -12 0 L 12 0 M 0 -12 L 0 12 M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#FFFFFF" stroke-width="3"/>
    <text x="-45" y="-15" fill="#38BDF8" font-size="13" font-weight="bold">hq-rtr (FRR 10.7)</text>
    <text x="-45" y="0" fill="#94A3B8" font-size="10">AS65001 | 172.20.20.11</text>
  </g>

  <!-- 3. Branch Edge Router (clab-sase-lab-branch-rtr) -->
  <g transform="translate(950, 340)">
    <circle r="32" fill="#0369A1" stroke="#38BDF8" stroke-width="3"/>
    <path d="M -12 0 L 12 0 M 0 -12 L 0 12 M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#FFFFFF" stroke-width="3"/>
    <text x="40" y="-15" fill="#38BDF8" font-size="13" font-weight="bold">branch-rtr (FRR 10.7)</text>
    <text x="40" y="0" fill="#94A3B8" font-size="10">AS65002 | 172.20.20.21</text>
  </g>

  <!-- 4. HQ Firewall (hq-fw Suricata IPS) -->
  <g transform="translate(250, 500)">
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
    <!-- Brick pattern -->
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="-18" y2="20" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="18" y2="20" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="0" y="-28" fill="#EF4444" font-size="12" font-weight="bold" text-anchor="middle">hq-fw (Suricata IPS)</text>
  </g>

  <!-- 5. Branch Firewall (branch-fw Suricata IPS) -->
  <g transform="translate(950, 500)">
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="-18" y2="20" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="18" y2="20" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="0" y="-28" fill="#EF4444" font-size="12" font-weight="bold" text-anchor="middle">branch-fw (Suricata IPS)</text>
  </g>

  <!-- 6. HQ Servers (Wiki, Keycloak, Wazuh, Grafana) -->
  <!-- Wiki Server -->
  <g transform="translate(130, 640)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#38BDF8" stroke-width="2"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="12" cy="18" r="2" fill="#22C55E"/>
    <text x="0" y="40" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">wiki-app</text>
    <text x="0" y="52" fill="#94A3B8" font-size="9" text-anchor="middle">172.20.20.40</text>
  </g>

  <!-- Keycloak Server -->
  <g transform="translate(250, 640)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#581C87" stroke="#A855F7" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#C084FC" stroke-width="2"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#C084FC" stroke-width="2"/>
    <circle cx="12" cy="18" r="2" fill="#22C55E"/>
    <text x="0" y="40" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">keycloak (IdP)</text>
    <text x="0" y="52" fill="#94A3B8" font-size="9" text-anchor="middle">172.28.0.10</text>
  </g>

  <!-- Wazuh SIEM Server -->
  <g transform="translate(370, 640)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#713F12" stroke="#EAB308" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#FDE047" stroke-width="2"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#FDE047" stroke-width="2"/>
    <circle cx="12" cy="18" r="2" fill="#22C55E"/>
    <text x="0" y="40" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">wazuh-indexer</text>
    <text x="0" y="52" fill="#94A3B8" font-size="9" text-anchor="middle">250 Alerts</text>
  </g>

  <!-- Grafana Server -->
  <g transform="translate(460, 640)">
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#14532D" stroke="#22C55E" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#4ADE80" stroke-width="2"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="12" cy="18" r="2" fill="#22C55E"/>
    <text x="0" y="40" fill="#F8FAFC" font-size="11" font-weight="bold" text-anchor="middle">sase-grafana</text>
    <text x="0" y="52" fill="#94A3B8" font-size="9" text-anchor="middle">Port 3000</text>
  </g>

  <!-- Cloudflare Access Badge top right -->
  <g transform="translate(750, 120)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#F97316" fill-opacity="0.2" stroke="#F97316" stroke-width="2"/>
    <text x="65" y="22" fill="#FB923C" font-size="11" font-weight="bold" text-anchor="middle">Cloudflare ZTNA</text>
    <text x="65" y="38" fill="#F8FAFC" font-size="10" text-anchor="middle">sase-lab.win</text>
  </g>

  <!-- Legend Box at Bottom Right -->
  <g transform="translate(850, 620)">
    <rect x="0" y="0" width="280" height="110" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="22" fill="#F8FAFC" font-size="12" font-weight="bold">Cisco Packet Tracer Legend</text>
    <circle cx="25" cy="42" r="8" fill="#0369A1" stroke="#38BDF8"/>
    <text x="42" y="46" fill="#94A3B8" font-size="11">FRR Router (BGP Mesh)</text>

    <rect x="18" y="58" width="14" height="12" fill="#B91C1C" stroke="#EF4444"/>
    <text x="42" y="68" fill="#94A3B8" font-size="11">Firewall / Suricata IPS</text>

    <rect x="18" y="80" width="14" height="12" fill="#334155" stroke="#94A3B8"/>
    <text x="42" y="90" fill="#94A3B8" font-size="11">Server / Cloud Container Workload</text>
  </g>
</svg>
