<ossec_config>
  <global>
    <email_notification>no</email_notification>
    <alerts_log>yes</alerts_log>
    <jsonout_output>yes</jsonout_output>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Remote agent listener -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Ruleset: only include directories that exist in the container -->
  <ruleset>
    <rule_dir>rules</rule_dir>
    <decoder_dir>decoders</decoder_dir>
    <list>etc/lists/audit-keys</list>
  </ruleset>

  <!-- Wazuh Manager system log monitoring -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/ossec.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <!-- Cloudflare Zero Trust Logs (created if files don't exist, no error) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/cloudflare/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/cloudflare/gateway.log</location>
  </localfile>

  <!-- OPNsense/Suricata Logs -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Keycloak Authentication Logs -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/keycloak/authentication.log</location>
  </localfile>

</ossec_config>
