version: '3.8'

services:
  # Wazuh Manager
  wazuh-manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    image: custom-sase-wazuh-manager:latest
    platform: linux/amd64
    container_name: sase-wazuh-manager
    hostname: wazuh-manager.sase-lab.local
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
      - "55000:55000/tcp"
    volumes:
      - wazuh-manager-config:/var/ossec/data
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_PASSWORD=${WAZUH_FILEBEAT_PASSWORD}
      - API_USERNAME=${WAZUH_API_USERNAME}
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    networks:
      - sase-siem-net
    depends_on:
      - wazuh-indexer
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://localhost:55000/ | grep -qE '200|401|302'"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.8.0
    platform: linux/amd64
    container_name: sase-wazuh-indexer
    hostname: wazuh-indexer.sase-lab.local
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - wazuh-indexer-data:/usr/share/wazuh-indexer/data
    environment:
      - discovery.type=single-node
      - cluster.name=wazuh-cluster
      - node.name=wazuh-indexer
      - DISABLE_SECURITY_PLUGIN=false
    networks:
      - sase-siem-net
    healthcheck:
      test: ["CMD-SHELL", "curl -u ${WAZUH_INDEXER_USERNAME}:${WAZUH_INDEXER_PASSWORD} -k -s https://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # Wazuh Dashboard
  wazuh-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: custom-sase-wazuh-dashboard:latest
    platform: linux/amd64
    container_name: sase-wazuh-dashboard
    hostname: wazuh-dashboard.sase-lab.local
    ports:
      - "5601:5601"
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data
    environment:
      - OPENSEARCH_HOSTS=https://wazuh-indexer:9200
      - OPENSEARCH_USERNAME=${WAZUH_INDEXER_USERNAME}
      - OPENSEARCH_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - SERVER_NAME=wazuh-dashboard
    networks:
      - sase-siem-net
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '200|401|302'"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # Grafana
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    image: custom-sase-grafana:latest
    container_name: sase-grafana
    hostname: grafana.sase-lab.local
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-opensearch-datasource
      - GF_SERVER_ROOT_URL=https://grafana.sase-lab.win
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/sase-dashboard.json
      # Keycloak OAuth — users log into Grafana with their sase-lab Keycloak account
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak SSO
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=grafana-secret-change-in-production
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://keycloak.sase-lab.win/realms/sase-lab/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://sase-keycloak:8080/realms/sase-lab/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://sase-keycloak:8080/realms/sase-lab/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'engineering') && 'Admin' || 'Viewer'
    networks:
      - sase-siem-net
    depends_on:
      - wazuh-indexer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # Loki for log aggregation
  loki:
    build:
      context: .
      dockerfile: Dockerfile.loki
    image: custom-sase-loki:latest
    container_name: sase-loki
    hostname: loki.sase-lab.local
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sase-siem-net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # Promtail for log collection
  promtail:
    build:
      context: .
      dockerfile: Dockerfile.promtail
    image: custom-sase-promtail:latest
    container_name: sase-promtail
    hostname: promtail.sase-lab.local
    volumes:
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sase-siem-net
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

networks:
  sase-siem-net:
    name: wazuh_sase-siem-net
    external: true

volumes:
  wazuh-manager-config:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  grafana-data:
  loki-data:
