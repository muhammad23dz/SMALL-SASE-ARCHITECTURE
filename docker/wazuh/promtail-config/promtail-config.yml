server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Wazuh Manager Logs
  - job_name: wazuh-manager
    static_configs:
      - targets:
          - localhost
        labels:
          job: wazuh-manager
          __path__: /var/log/wazuh.log

  # OPNsense/Suricata Logs
  - job_name: opnsense-syslog
    syslog:
      listen_address: 0.0.0.0:1514
      labels:
        job: opnsense-syslog
        site: "{{ .Site }}"
    relabel_configs:
      - source_labels: [__syslog_message_hostname]
        target_label: hostname

  # Cloudflare Zero Trust Logs
  - job_name: cloudflare-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloudflare-access
          __path__: /var/log/cloudflare/access.log

  - job_name: cloudflare-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloudflare-gateway
          __path__: /var/log/cloudflare/gateway.log

  # Keycloak Authentication Logs
  - job_name: keycloak-auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: keycloak-auth
          __path__: /var/log/keycloak/authentication.log

  # Suricata EVE Logs
  - job_name: suricata-eve
    static_configs:
      - targets:
          - localhost
        labels:
          job: suricata-eve
          __path__: /var/log/suricata/eve.json
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            src_ip: src_ip
            dest_ip: dest_ip
            event_type: event_type
            alert: alert
      - labels:
          event_type:
          src_ip:
          dest_ip:
